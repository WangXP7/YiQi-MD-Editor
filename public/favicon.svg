<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#2a1a4e"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#mainGrad)" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="url(#mainGrad)" opacity="0.15" filter="url(#glowFilter)"/>
  <g transform="translate(256, 270)" filter="url(#glowFilter)">
    <!-- Y letter -->
    <path d="M-70 -100 L-30 -50 L-30 80" stroke="url(#mainGrad)" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 -100 L-30 -50" stroke="url(#mainGrad)" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- M letter -->
    <path d="M0 -80 L0 80 M0 -80 L50 -30 L100 -80 M100 -80 L100 80" stroke="url(#mainGrad)" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="256" y="130" text-anchor="middle" fill="url(#mainGrad)" font-family="system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="3">YiQi</text>
  <text x="256" y="450" text-anchor="middle" fill="url(#mainGrad)" font-family="system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="4">@MD Editor</text>
  <circle cx="100" cy="100" r="4" fill="#6366f1" opacity="0.8"/>
  <circle cx="412" cy="100" r="4" fill="#ec4899" opacity="0.8"/>
  <circle cx="100" cy="412" r="4" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="412" cy="412" r="4" fill="#d946ef" opacity="0.8"/>
</svg>
