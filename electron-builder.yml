appId: com.mdeditor.app
productName: YiQi@MD-Editor-wb-Hy3
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: resources/icon.ico
    to: icon.ico
win:
  target:
    - portable
    - nsis
  sign: ./scripts/do-not-sign.js
  icon: resources/icon.ico
portable:
  artifactName: YiQi@MD-Editor-wb-Hy3-Portable-${version}.${ext}
nsis:
  artifactName: YiQi@MD-Editor-wb-Hy3-Setup-${version}.${ext}
  shortcutName: YiQi@MD-Editor-wb-Hy3
  createDesktopShortcut: always
