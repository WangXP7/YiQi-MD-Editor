<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http:;">
  <title>墨览 YiQi@MD-Editor-wb-DSv4-Flash 1.1.0</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light">
  <!-- 顶部工具栏 -->
  <header id="toolbar">
    <div class="toolbar-left">
      <button id="btn-outline" class="tool-btn outline-toggle" title="显示/隐藏大纲栏 (Ctrl+Shift+O)">📑 大纲</button>
      <span id="app-logo" class="app-logo">墨览 YiQi</span>
      <span id="encoding-badge" class="encoding-badge">UTF-8</span>
    </div>
    <div class="toolbar-right">
      <button id="btn-new" class="tool-btn" title="新建 (Ctrl+N)">新建</button>
      <button id="btn-open" class="tool-btn" title="打开 (Ctrl+O)">打开</button>
      <button id="btn-save" class="tool-btn" title="保存 (Ctrl+S)">保存</button>
      <button id="btn-export" class="tool-btn" title="导出">导出</button>
      <div class="toolbar-divider"></div>
      <div id="view-switch" class="view-switch" role="group" aria-label="视图切换">
        <button id="view-editor" class="view-btn" title="仅编辑 (Ctrl+1)">编辑</button>
        <button id="view-split" class="view-btn active" title="分屏 (Ctrl+3)">分屏</button>
        <button id="view-preview" class="view-btn" title="仅预览 (Ctrl+2)">预览</button>
      </div>
      <div class="toolbar-divider"></div>
      <button id="btn-theme" class="tool-btn" title="切换主题 (Ctrl+T)">🌙</button>
      <button id="btn-find" class="tool-btn" title="查找 (Ctrl+F)">查找</button>
    </div>
  </header>

  <!-- 主内容行：左侧大纲栏 + 内容列 -->
  <div id="app-body">
    <!-- 左侧大纲栏（可折叠，宽度可拖拽） -->
    <aside id="outline-sidebar" class="outline-sidebar" aria-label="文档大纲">
      <div class="outline-header">
        <span class="outline-title">📑 大纲</span>
        <button id="outline-collapse" class="outline-collapse" title="隐藏大纲栏">«</button>
      </div>
      <div id="outline-list" class="outline-list"></div>
    </aside>

    <!-- 大纲栏宽度拖拽分隔条 -->
    <div id="outline-divider" class="divider outline-divider" title="拖动调整大纲栏宽度"></div>

    <!-- 内容列：多标签栏 + 主工作区 -->
    <div id="content-col">
      <!-- 多标签栏（VS Code 风格，动态渲染） -->
      <nav id="tabbar" class="tabbar" aria-label="打开的文档"></nav>

      <!-- 主工作区 -->
      <main id="workspace">
        <!-- 编辑区 -->
        <section id="editor-pane" class="pane">
          <div id="editor-container"></div>
        </section>

        <!-- 分隔条 -->
        <div id="divider" class="divider" title="拖动调整分栏宽度"></div>

        <!-- 预览区：使用 sandbox iframe 隔离样式 -->
        <section id="preview-pane" class="pane">
          <iframe id="preview-frame" sandbox="allow-same-origin"></iframe>
        </section>
      </main>
    </div>
  </div>

  <!-- 查找/替换面板 -->
  <div id="find-panel" class="find-panel hidden">
    <div class="find-row">
      <input id="find-input" type="text" placeholder="查找…" spellcheck="false">
      <button id="find-prev" class="find-btn" title="上一个 (Shift+Enter)">▲</button>
      <button id="find-next" class="find-btn" title="下一个 (Enter)">▼</button>
      <button id="find-close" class="find-btn" title="关闭 (Esc)">✕</button>
    </div>
    <div class="find-row">
      <input id="replace-input" type="text" placeholder="替换为…" spellcheck="false">
      <button id="replace-all" class="find-btn" title="全部替换">全部替换</button>
      <button id="replace-one" class="find-btn primary" title="替换当前">替换</button>
    </div>
    <div class="find-row find-row-tools">
      <label class="find-check"><input id="find-case" type="checkbox">区分大小写</label>
      <label class="find-check"><input id="find-regex" type="checkbox">正则</label>
      <span id="find-status" class="find-status"></span>
    </div>
  </div>

  <!-- 状态栏 -->
  <footer id="statusbar">
    <span id="stat-cursor">行 1，列 1</span>
    <span class="stat-divider">|</span>
    <span id="stat-lines">0 行</span>
    <span class="stat-divider">|</span>
    <span id="stat-words">0 字</span>
    <span class="stat-divider">|</span>
    <span id="stat-chars">0 字符</span>
    <span class="stat-spacer"></span>
    <span id="stat-encoding">UTF-8</span>
  </footer>

  <!-- 拖拽覆盖层 -->
  <div id="drop-overlay" class="drop-overlay hidden">
    <div class="drop-overlay-text">松开以打开文件</div>
  </div>

  <!-- 选区悬浮复制按钮（由 copybutton.js 动态创建） -->

  <!-- 渲染层由 esbuild 打包为单一 bundle（npm run build:renderer 生成） -->
  <script src="vendor/bundle.js"></script>
</body>
</html>
