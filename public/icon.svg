<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#2a1a4e"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Decorative gradient border -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#mainGrad)" stroke-width="3" opacity="0.6"/>
  
  <!-- Glow effect -->
  <circle cx="256" cy="256" r="160" fill="url(#glow)" opacity="0.3" filter="url(#glowFilter)"/>
  
  <!-- Monogram YM -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Y letter -->
    <g transform="translate(-90, -120)">
      <!-- Y top left -->
      <path d="M0 0 L50 70 L50 160" stroke="url(#mainGrad)" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Y top right -->
      <path d="M100 0 L50 70" stroke="url(#mainGrad)" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- M letter -->
    <g transform="translate(10, -100)">
      <path d="M0 0 L0 160 M0 0 L70 80 L140 0 M140 0 L140 160" stroke="url(#mainGrad)" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- MD text overlay -->
  <g transform="translate(256, 160)">
    <text x="0" y="0" text-anchor="middle" fill="url(#mainGrad)" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="2">YiQi</text>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="100" cy="100" r="4" fill="#6366f1" opacity="0.8"/>
  <circle cx="412" cy="100" r="4" fill="#ec4899" opacity="0.8"/>
  <circle cx="100" cy="412" r="4" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="412" cy="412" r="4" fill="#d946ef" opacity="0.8"/>
  
  <!-- Small decorative circles -->
  <circle cx="80" cy="256" r="3" fill="#6366f1" opacity="0.6"/>
  <circle cx="432" cy="256" r="3" fill="#ec4899" opacity="0.6"/>
  <circle cx="256" cy="80" r="3" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="256" cy="432" r="3" fill="#d946ef" opacity="0.6"/>
  
  <!-- Version badge -->
  <g transform="translate(256, 430)">
    <rect x="-40" y="-12" width="80" height="24" rx="12" fill="url(#mainGrad)" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1">v1.0.0</text>
  </g>
</svg>
